<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>webserv tester</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <h1>webserv tester</h1>

  <section>
    <h2>Static</h2>
    <button onclick="sendRequest('GET', '/hello.txt')">GET /hello.txt</button>
    <button onclick="sendRequest('GET', '/dir/')">GET /dir/</button>
    <button onclick="sendRequest('GET', '/dir/index.html')">GET /dir/index.html</button>
    <button onclick="sendRequest('GET', '/images/')">GET /images/</button>
    <button onclick="sendRequest('GET', '/not-found-file')">GET /not-found-file</button>
  </section>

  <section>
    <h2>CGI</h2>
    <button onclick="sendRequest('GET', '/cgi-bin/test_env.sh')">GET test_env.sh</button>
    <button onclick="sendRequest('GET', '/cgi-bin/test_query.sh?name=bonbon&x=42')">GET test_query.sh</button>
    <button onclick="sendPostText()">POST echo_body.sh</button>
    <button onclick="sendRequest('GET', '/cgi-bin/test_big.sh')">GET test_big.sh</button>
    <button onclick="sendRequest('GET', '/cgi-bin/test_crash.sh')">GET test_crash.sh</button>
    <button onclick="sendRequest('GET', '/cgi-bin/test_slow.sh')">GET test_slow.sh</button>
  </section>

  <section>
    <h2>Upload</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">POST /upload</button>
  </section>

  <section>
    <h2>Delete uploaded file</h2>
    <input type="text" id="deleteName" placeholder="example.txt">
    <button onclick="deleteFile()">DELETE /upload/&lt;name&gt;</button>
  </section>

  <section>
    <h2>Redirect / Error page</h2>
    <button onclick="sendRequest('GET', '/redirection/')">GET /redirection/</button>
    <button onclick="sendRequest('GET', '/missing')">GET /missing</button>
  </section>

  <section>
    <h2>Response</h2>
    <div id="meta"></div>
    <pre id="headers"></pre>
    <pre id="body"></pre>
  </section>

  <script src="./app.js"></script>
</body>
</html>
